# textlint の指摘から除外するパターン．
# 中央テンプレ tomio2480/github-workflows の composite action が本ファイルを読み，
# runtime config の filters.allowlist へ注入する（allow は文字列または /regex/flags）．
#
# 原稿側では直せない誤検出だけを列挙する．文体や表記ゆれの指摘を止める目的で使わない．

allow:
  # 図表キャプション（例: 表 1. 版面を決める変数）．
  # キャプションは体言止めとし句点を付けないが，ja-no-mixed-period は
  # キャプションと地の文を区別できず指摘を出す．
  # 「表」「図」＋半角スペース＋数字＋"." ＋半角スペースを必須にして，
  # 「表記ゆれ」のような地の文に一致しないようにする．
  - "/^(図|表) \\d+\\. .+$/m"

  # 字種そのものを話題にする鍵括弧（「、」「。」）．
  # 原稿の句読点の規約を書くために旧字種を引用するが，
  # 読点・句点の規則が地の文と同じように指摘してしまう．
  # 鍵括弧で 1 字だけ囲んだ形を除外し，区切りとして使われた「、」の検出は残す．
  - "/「[、。]」/"
